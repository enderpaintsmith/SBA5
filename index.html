<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>My Personal Blog</h1>
        <p>Write, save, and manage your thoughts.</p>
    </header>

    <main>
        <!-- Post Form -->
        <section class="form-section">
            <h2 id="form-heading">Create a New Post</h2>

            <form id="post-form" novalidate>
                <div class="form-group">
                    <label for="post-title">Post Title</label>
                    <input
                        type="text"
                        id="post-title"
                        name="title"
                        placeholder="Enter your post title"
                    >
                    <span id="title-error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="post-content">Post Content</label>
                    <textarea
                        id="post-content"
                        name="content"
                        rows="8"
                        placeholder="Write your post here..."
                    ></textarea>
                    <span id="content-error" class="error-message"></span>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submit-button">
                        Publish Post
                    </button>

                    <button
                        type="button"
                        id="cancel-button"
                        class="cancel-button hidden"
                    >
                        Cancel Edit
                    </button>
                </div>
            </form>
        </section>

        <!-- Posts Section -->
        <section class="posts-section">
            <h2>My Posts</h2>

            <div id="posts-container">
                <!-- Posts will be added here dynamically -->
            </div>

            <p id="empty-message">No posts yet. Create your first post!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Personal Blog</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
